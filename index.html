<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>File Forge — Convert anything, locally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151c;
    --bg-2:#0d0f14;
    --panel:#1a1f28;
    --panel-2:#212733;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.14);
    --ink:#edeae2;
    --muted:#8b93a1;
    --muted-2:#5c6474;
    --brass:#c9974b;
    --brass-bright:#e0b56e;
    --brass-dim:rgba(201,151,75,.14);
    --success:#6fa98a;
    --danger:#c96b5a;
    --radius:16px;
    --radius-sm:10px;
    --shadow-stamp: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 6px rgba(0,0,0,.35), 0 1px 0 rgba(0,0,0,.3);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(201,151,75,.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  ::selection{background:var(--brass-dim); color:var(--brass-bright);}

  a, button{font-family:inherit;}
  button{cursor:pointer;}

  .wrap{max-width:720px; margin:0 auto; padding:0 18px 64px;}

  /* Header */
  header.top{
    padding:28px 18px 20px;
    max-width:720px; margin:0 auto;
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  }
  .brand{display:flex; flex-direction:column; gap:6px;}
  .brand .mark{
    display:flex; align-items:center; gap:10px;
  }
  .brand .mark .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--brass);
    box-shadow:0 0 0 3px var(--brass-dim);
  }
  .brand .mark span.name{
    font-family:'Fraunces',serif; font-weight:600; font-size:22px; letter-spacing:.01em;
  }
  .brand .tagline{
    color:var(--muted); font-size:13px; letter-spacing:.02em; max-width:34ch;
  }
  .local-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--success);
    background:rgba(111,169,138,.1);
    border:1px solid rgba(111,169,138,.3);
    padding:6px 10px; border-radius:999px;
    white-space:nowrap;
    display:flex; align-items:center; gap:6px;
    flex-shrink:0;
  }
  .local-badge::before{content:'●'; font-size:8px;}

  /* Hero stamp row (home only) */
  .hero-stamps{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:8px 0 30px;
    flex-wrap:wrap;
  }
  .stamp{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600; font-size:12.5px; letter-spacing:.04em;
    color:var(--ink);
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line-strong);
    border-radius:10px;
    padding:9px 13px;
    box-shadow:var(--shadow-stamp);
  }
  .stamp.brass{color:var(--brass-bright); border-color:rgba(201,151,75,.4); background:linear-gradient(180deg, rgba(201,151,75,.16), rgba(201,151,75,.06));}
  .hero-arrow{color:var(--muted-2); font-size:16px;}

  /* Tool grid */
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted-2);
    margin:26px 2px 12px;
  }
  .tool-grid{display:grid; grid-template-columns:1fr; gap:10px;}
  @media(min-width:560px){ .tool-grid{grid-template-columns:1fr 1fr;} }
